<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AWS Events Management</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: #1a1f2e;
      padding: 28px 20px 20px;
      text-align: center;
    }
    header h1 {
      color: #ffffff;
      font-size: 1.7rem;
      font-weight: 700;
      letter-spacing: -.3px;
      margin-bottom: 14px;
    }
    .btn-service {
      background: #4a90e2;
      color: #fff;
      border: none;
      padding: 7px 22px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      letter-spacing: .5px;
    }
    .btn-service:hover { background: #357abd; }

    /* ── Main ── */
    main {
      max-width: 680px;
      margin: 28px auto;
      padding: 0 16px;
    }

    /* ── Card ── */
    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
      margin-bottom: 18px;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #1a1f2e;
      margin-bottom: 16px;
    }

    /* ── Refresh Button ── */
    .btn-refresh {
      background: #e8622a;
      color: #fff;
      border: none;
      padding: 8px 20px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      margin-bottom: 18px;
      font-weight: 600;
    }
    .btn-refresh:hover { background: #c9501f; }

    /* ── Status List ── */
    .status-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .status-item {
      font-size: 0.92rem;
      color: #333;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-item span.label { color: #555; }
    .status-item span.value { color: #1a1f2e; font-weight: 600; }

    /* ── Event List ── */
    .event-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .event-item {
      border: 1px solid #e8eaed;
      border-radius: 10px;
      padding: 16px 18px;
      background: #fafbfc;
    }
    .event-name {
      font-size: 1rem;
      font-weight: 700;
      color: #1a1f2e;
      margin-bottom: 8px;
    }
    .event-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 0.84rem;
      color: #555;
    }
    .event-meta span { display: flex; align-items: center; gap: 4px; }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: .3px;
    }
    .badge-completed { background: #e8f5e9; color: #2e7d32; }
    .badge-upcoming  { background: #e3f2fd; color: #1565c0; }
    .badge-ongoing   { background: #fff3e0; color: #e65100; }
    .badge-cancelled { background: #fce4ec; color: #b71c1c; }
  </style>
</head>
<body>

<header>
  <h1>🚀 AWS Events Management</h1>
  <button class="btn-service">서비스</button>
</header>

<main>
  <!-- 실시간 이벤트 목록 -->
  <div class="card">
    <div class="card-title">실시간 이벤트 목록</div>
    <button class="btn-refresh" onclick="loadEvents()">새로고침</button>

    <!-- 상태 표시 -->
    <div class="status-list" style="margin-bottom:20px">
      <div class="status-item">🌐 <span class="label">API 상태:</span><span class="value" id="api-status">연결됨</span></div>
      <div class="status-item">🗄️ <span class="label">S3 호스팅:</span><span class="value" id="s3-status">활성화됨</span></div>
      <div class="status-item">⚡ <span class="label">Lambda:</span><span class="value">Python 3.12</span></div>
      <div class="status-item">🗃️ <span class="label">DynamoDB:</span><span class="value" id="db-status">연결됨</span></div>
    </div>

    <!-- 이벤트 카드 목록 -->
    <div class="event-list" id="event-list">
      <!-- JS로 렌더링 -->
    </div>
  </div>
</main>

<script>
  const EVENTS = [
    {
      name:     'AWS 클라우드 기초 워크샵',
      date:     '2025-03-15',
      location: '서울',
      attendees: 50,
      status:   'completed',
    },
    {
      name:     'AWS Summit Seoul 2025',
      date:     '2025-05-14',
      location: '서울 COEX',
      attendees: 12000,
      status:   'completed',
    },
    {
      name:     'ECS Fargate Hands-on',
      date:     '2025-09-15',
      location: '서울 강남',
      attendees: 300,
      status:   'upcoming',
    },
    {
      name:     'AWS re:Invent 2025',
      date:     '2025-12-01',
      location: 'Las Vegas',
      attendees: 50000,
      status:   'upcoming',
    },
    {
      name:     'AWS GameDay Korea',
      date:     '2025-07-20',
      location: '온라인',
      attendees: 800,
      status:   'ongoing',
    },
    {
      name:     'ML/AI on AWS Summit',
      date:     '2025-04-18',
      location: '부산 BEXCO',
      attendees: 3200,
      status:   'cancelled',
    },
  ];

  const STATUS_LABEL = {
    completed: '완료',
    upcoming:  '예정',
    ongoing:   '진행중',
    cancelled: '취소',
  };
  const STATUS_CLASS = {
    completed: 'badge-completed',
    upcoming:  'badge-upcoming',
    ongoing:   'badge-ongoing',
    cancelled: 'badge-cancelled',
  };

  function fmt(n) {
    return n >= 1000 ? (n / 1000).toFixed(0) + ',000+' : n + '명';
  }

  function loadEvents() {
    const list = document.getElementById('event-list');
    list.innerHTML = '';
    EVENTS.forEach(ev => {
      list.innerHTML += `
        <div class="event-item">
          <div class="event-name">${ev.name}</div>
          <div class="event-meta">
            <span>📅 ${ev.date}</span>
            <span>📍 ${ev.location}</span>
            <span>👥 ${fmt(ev.attendees)}</span>
            <span><span class="badge ${STATUS_CLASS[ev.status]}">${STATUS_LABEL[ev.status]}</span></span>
          </div>
        </div>`;
    });
  }

  loadEvents();
</script>
</body>
</html>
