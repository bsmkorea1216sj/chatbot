# 이 파일을 resume.yaml 로 복사해서 쓰십시오.
# resume.yaml 은 .gitignore 에 걸려 있어 저장소에 올라가지 않습니다.

기본정보:
  성명: ""
  한자성명: ""
  영문성명: ""
  생년월일: ""          # 예: 1970-01-01
  휴대전화: ""
  이메일: ""
  주소: ""

학력:
  - 구분: "박사"         # 학사 / 석사 / 박사
    학교: ""
    전공: ""
    입학: ""            # 예: 2015-03
    졸업: ""            # 예: 2019-02
    학위논문: ""

경력:
  - 기관: ""
    직위: ""
    담당업무: ""
    시작: ""            # 예: 2020-03
    종료: ""            # 재직 중이면 "현재"

강의경력:
  - 기관: ""
    과목: ""
    학기: ""            # 예: 2026-1
    시수: ""

연구실적:
  - 구분: "논문"         # 논문 / 저서 / 특허 / 연구과제
    제목: ""
    발행처: ""
    발행일: ""
    저자구분: ""        # 단독 / 주저자 / 공동

자격증:
  - 명칭: ""
    발급기관: ""
    취득일: ""

첨부파일:                # ./files/ 안의 파일명만 적습니다
  - ""
